poll_ms = 600
# Set false to inspect and record order without moving the mouse or icons.
apply = true

[visible]
mode = "alphabetical"
delay_ms = 1500
lock_head = []
lock_tail = []
system_names = [
    "Network", "Volume", "Battery", "Safely Remove Hardware", "Printer",
    "网络", "音量", "电池", "安全删除硬件", "打印机",
]

[hidden]
mode = "alphabetical"
# Longer settling time accommodates applications that minimize to the tray.
delay_ms = 3000
lock_head = []
lock_tail = []
system_names = [
    "Network", "Volume", "Battery", "Safely Remove Hardware", "Printer",
    "网络", "音量", "电池", "安全删除硬件", "打印机",
]
