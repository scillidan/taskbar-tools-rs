# Re-enumerate the shell at this interval. One physical move happens per tick.
poll_ms = 750
# Wait for a newly appeared/changed item to settle before sorting it.
delay_ms = 1500
# Set false to inspect and record order without moving the mouse or icons.
apply = true

[order]
# alphabetical, alphabetical-desc, or custom
mode = "alphabetical"
lock_head = []
lock_tail = []
# Case-insensitive names treated as shell controls rather than applications.
system_names = [
    "Start", "Search", "Task view", "Widgets", "Copilot",
    "开始", "搜索", "任务视图", "小组件",
]
